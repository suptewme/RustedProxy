[package]
name = "rustedproxy_core"
version = "0.1.0"
edition = "2021"
description = "RustedProxy networking core"
license = "MIT"

[lib]
name = "rustedproxy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
anyhow = "1"
rand = "0.8"
base64 = "0.22"
url = "2"
percent-encoding = "2"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
maxminddb = "0.26"
flate2 = "1"
hex = "0.4"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
# Legacy Shadowsocks stream ciphers (aes-*-cfb, rc4-md5) still used by many
# public free-node lists. AES-CFB128 is implemented by hand in ss.rs, so there
# is no cfb-mode dependency.
aes = "0.8"
ctr = "0.9"
rc4 = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
tun2proxy = { version = "0.8.7", default-features = false }
jni = "0.21"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
tun2proxy = { version = "0.8.7", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding enabled: a panic inside one networking task must never abort
# the whole Android process (crash reports on scan/stop). FFI entry points are
# already wrapped in catch_unwind.
panic = "unwind"
